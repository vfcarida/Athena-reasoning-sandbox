name: Continuous Integration & MLOps Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis-and-linting:
    name: Static Analysis & Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pydantic types-PyYAML

      - name: Run Ruff Linter
        run: |
          ruff check src evals tests

      - name: Run Security Scan (Bandit)
        run: |
          bandit -r src/ -x tests/

      - name: Run Strict MyPy Type Checker
        run: |
          mypy src evals --strict

  unit-tests-and-coverage:
    name: Unit Tests & Code Coverage Gate (>90%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Unit Tests with Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

  deepeval-trajectory-gate:
    name: DeepEval Agent Trajectory Evaluation Gate (Score >= 0.75)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Evaluation Suite Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install deepeval pytest-asyncio

      - name: Execute DeepEval Trajectory Test Suite
        run: |
          deepeval test run evals/test_agent_trajectory.py
