name: Continuous Integration & MLOps Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis-and-linting:
    name: Static Analysis & Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pydantic pydantic-settings sqlglot duckdb types-PyYAML

      - name: Run Ruff Linter
        run: |
          ruff check src evals tests

      - name: Run Security Scan (Bandit)
        run: |
          bandit -r src/ -x tests/ -s B105,B106,B615 -ll

      - name: Run MyPy Type Checker on Core Architecture
        run: |
          mypy src/engine src/athena src/state src/sandbox

  unit-tests-and-coverage:
    name: Unit Tests & Code Coverage Gate (Lane 1 >= 48%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio "moto[athena]>=5.0.0"

      - name: Run Unit Tests with Coverage
        run: |
          pytest tests/ -v -m "not heavy and not lane2" --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=47

  deterministic-trajectory-gate:
    name: Deterministic Trajectory Heuristic Evaluation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Evaluation Suite Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Execute Deterministic Trajectory Evaluation Suite (Offline Lane 1)
        run: |
          pytest evals/test_agent_trajectory.py -v -m "not heavy and not lane2"
